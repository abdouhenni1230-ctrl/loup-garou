<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download App</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        :root {
            /* Aqua Dark Theme Colors */
            --bg-color: #0a192f; /* Deep Dark Blue */
            --card-bg: #112240; /* Slightly lighter navy */
            --text-primary: #e6f1ff; /* Off-white */
            --text-secondary: #8892b0; /* Muted blue-grey */
            --aqua-accent: #64ffda; /* Bright Aqua/Teal */
            --aqua-hover: rgba(100, 255, 218, 0.1);
            --btn-shadow: 0 10px 30px -10px rgba(100, 255, 218, 0.3);
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 0px 10px;
            box-sizing: border-box;
        }

        .container {
            background: var(--bg-color);
            padding: 15px 0px;
            border-radius: 20px;
            
            text-align: center;
            max-width: 600px;
            width: 100%;
            margin-top: 0px;
        }

        /* App Header with Icon and Name */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .app-icon {
            width: 60px;
            height: 60px;
            border-radius: 14px;
            background-color: var(--bg-color);
            object-fit: cover;
            border: 2px solid var(--aqua-accent);
            /* Placeholder for user's icon */
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        #app-name {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--aqua-accent);
            margin: 0;
        }

        .description {
            color: var(--text-secondary);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        /* Google Play Style Image Gallery */
        .gallery-container {
            width: 100%;
            overflow-x: auto;
            display: flex;
            gap: 12px;
            padding: 10px 0 20px 0;
            margin-bottom: 30px;
            scrollbar-width: thin;
            scrollbar-color: var(--aqua-accent) transparent;
            -webkit-overflow-scrolling: touch;
        }

        /* Custom Scrollbar for Chrome/Safari */
        .gallery-container::-webkit-scrollbar {
            height: 6px;
        }
        .gallery-container::-webkit-scrollbar-thumb {
            background: var(--aqua-accent);
            border-radius: 10px;
        }

        .screenshot {
            flex: 0 0 103px; /* Fixed width for each screenshot */
            height: 240px;
            background-color: #233554;
            border-radius: 12px;
            object-fit: cover;
            border: 1px solid rgba(100, 255, 218, 0.1);
            transition: transform 0.3s ease;
        }

        .screenshot:hover {
            transform: scale(1.02);
        }

        /* Download Button */
        .download-btn {
            background-color: transparent;
            color: var(--aqua-accent);
            border: 2px solid var(--aqua-accent);
            padding: 16px 40px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-block;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .download-btn:hover:not(:disabled) {
            background-color: var(--aqua-hover);
            box-shadow: var(--btn-shadow);
        }

        .download-btn:disabled {
            border-color: var(--text-secondary);
            color: var(--text-secondary);
            cursor: not-allowed;
        }

        #status-text {
            margin-top: 20px;
            font-size: 0.9rem;
            color: var(--aqua-accent);
            display: none;
            font-weight: 500;
        }

        footer {
            margin-top: auto;
            padding: 40px 20px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- App Header -->
        <div class="app-header">
            <!-- Replace 'icon.png' with your actual icon file name later -->
            <img src="icon.png" alt="App Icon" class="app-icon" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
            <div class="app-icon" style="display:none;">📱</div> 
            <h1 id="app-name">Loading...</h1>
        </div>
        
        <p class="description">Experience the latest features and improvements. Download the official APK directly to your device.</p>

        <!-- Screenshot Gallery (Google Play Style) -->
        <div class="gallery-container">
            <!-- Replace 'screen1.png', 'screen2.png', etc. with your actual file names -->
            <img src="screen1.png" alt="Screenshot 1" class="screenshot">
            <img src="screen2.png" alt="Screenshot 2" class="screenshot" >
            <img src="screen3.png" alt="Screenshot 3" class="screenshot" >
            <img src="screen4.png" alt="Screenshot 4" class="screenshot" >
            <img src="screen5.png" alt="Screenshot 5" class="screenshot" >
        </div>

        <button id="downloadBtn" class="download-btn" disabled>Download APK <b style="color:aqua;"id="size">00</b></button>
        
        <div id="status-text">Starting download... Please check your browser's notification bar.</div>
    </div>



    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBcUQ07BITO16cjACHlQLeWrmzeGcxdp80",
            authDomain: "timetowork-2d513.firebaseapp.com",
            projectId: "timetowork-2d513",
            storageBucket: "timetowork-2d513.firebasestorage.app",
            messagingSenderId: "998320132087",
            appId: "1:998320132087:web:1540e42ba00ab7a905e8f2",
            measurementId: "G-J1ETESGY19"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const appNameEl = document.getElementById('app-name');
        const appSizeEl = document.getElementById('size');
        const downloadBtn = document.getElementById('downloadBtn');
        const statusText = document.getElementById('status-text');

        let downloadUrl = "";

        // Fetch Data from Firebase
        database.ref('codes').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                downloadUrl = data.lien || "";
                const name = data.name || "Unknown App";
                const size = data.size || "00";
                appNameEl.innerText = name;
                appSizeEl.innerText = size + "MB";
                
                if (downloadUrl) {
                    downloadBtn.disabled = false;
                }
            } else {
                appNameEl.innerText = "No Data Available";
            }
        }, (error) => {
            console.error("Firebase Error:", error);
            appNameEl.innerText = "Connection Error";
        });

        // Direct Browser Download Logic
        downloadBtn.addEventListener('click', () => {
            if (!downloadUrl) return;

            statusText.style.display = 'block';

            const a = document.createElement('a');
            a.href = downloadUrl;
            a.style.display = 'none';
            a.setAttribute('download', ''); 
            document.body.appendChild(a);
            a.click();
            
            setTimeout(() => {
                document.body.removeChild(a);
            }, 100);
        });
    </script>
</body>
</html>
